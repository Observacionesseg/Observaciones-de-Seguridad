<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seguridad ISYSA | Reporte de Observaciones</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

    <style>
        :root {
            --night-blue: #002344; 
            --azul-claro: #004d82;
            --azul-acento: #007bff;
            --blanco: #ffffff;
            --gris-fondo: #f1f5f9;
            --borde: #cbd5e1;
            --texto: #0f172a;
        }

        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background: #e2e8f0;
            padding: 15px; 
            color: var(--texto);
            margin: 0;
            display: flex;
            justify-content: center;
        }

        .container { 
            max-width: 850px; 
            width: 100%;
            background: var(--blanco); 
            border-radius: 16px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            overflow: hidden;
            margin: 20px 0;
        }

        .header {
            background-color: var(--night-blue);
            padding: 30px 40px;
            color: white;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .header h1 { 
            margin: 0; 
            font-size: 1.6rem; 
            text-transform: uppercase;
            flex: 1;
        }

        .header img {
            max-height: 110px;
            width: auto;
            filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.2));
        }

        form { padding: 30px; }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 600px) {
            .grid-2 { grid-template-columns: 1fr; }
            .header { flex-direction: column-reverse; text-align: center; }
        }

        .form-group { margin-bottom: 18px; }

        .section { 
            margin: 25px 0;
            padding: 20px; 
            border-radius: 12px; 
            background-color: var(--gris-fondo);
            border-left: 5px solid var(--night-blue);
        }

        h3 { 
            color: var(--night-blue);
            border-bottom: 1px solid var(--borde);
            padding-bottom: 10px;
        }

        label { display: block; margin-bottom: 6px; font-weight: 600; }

        input, select, textarea { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid var(--borde); 
            border-radius: 8px; 
            box-sizing: border-box;
        }

        .checkbox-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 8px; 
            padding: 12px;
            background: white;
            border-radius: 8px;
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid var(--borde);
        }

        .checkbox-item { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; }
        .checkbox-item input { width: auto; }

        button { 
            width: 100%; 
            background: var(--night-blue);
            color: white; 
            padding: 16px; 
            border: none; 
            border-radius: 8px; 
            font-weight: bold;
            cursor: pointer; 
            margin-top: 20px;
        }

        button:disabled { background: #94a3b8; }
        .hidden { display: none; }
        .mt-2 { margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Observaciones de Seguridad ISYSA</h1>
        <img id="logoForm" src="" alt="ISYSA">
    </div>

    <form id="seguridadForm">
        <input type="hidden" name="horaReporte" id="horaReporte">

        <div class="form-group">
            <label>Tipo de Observación *</label>
            <select id="tipoObservacion" name="tipoObservacion" onchange="toggleSections()" required>
                <option value="">-- Seleccione una opción --</option>
                <option value="acto">Observación de Seguridad</option>
                <option value="condicion">Condición Insegura</option>
                <option value="altoRiesgo">Trabajo de alto riesgo</option>
            </select>
        </div>

        <div class="form-group">
            <label>Correo Electrónico *</label>
            <input type="email" name="correo" placeholder="ejemplo@isysa.com" required>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label>Fecha *</label>
                <input type="date" name="fecha" id="fechaActual" onchange="actualizarNumeroSemana()" required>
            </div>
            <div class="form-group">
                <label>Semana del Año</label>
                <input type="text" id="numSemana" name="semana" readonly style="background:#e2e8f0; text-align:center; font-weight:bold;">
            </div>
        </div>

        <div class="form-group">
            <label>Lugar de Observación *</label>
            <select name="sitio" id="sitioSelect" onchange="toggleOtroLugar()" required>
                <option value="">Seleccione lugar...</option>
                <option value="Almacén">Almacén</option>
                <option value="Biología">Biología</option>
                <option value="Calidad">Calidad</option>
                <option value="Campo">Campo</option>
                <option value="Embarques">Embarques</option>
                <option value="Lavadoras">Lavadoras</option>
                <option value="Molinos">Molinos</option>
                <option value="Oficinas">Oficinas</option>
                <option value="Registro (Vigilancia)">Registro (Vigilancia)</option>
                <option value="Mantto. Industrial">Mantto. Industrial</option>
                <option value="Mantto. Automotriz">Mantto. Automotriz</option>
                <option value="Transporte">Transporte</option>
                <option value="Otro">Otro</option>
            </select>
            <input type="text" name="otroSitio" id="otroSitio" class="hidden mt-2" placeholder="Especifique el lugar">
        </div>

        <div class="form-group">
            <label>Observador *</label>
            <input type="text" list="listaObservadores" name="observador" placeholder="Nombre de quien observa" required>
            <datalist id="listaObservadores"></datalist>
        </div>

        <div id="seccionActo" class="section hidden">
            <h3>I. OBSERVACIÓN DE SEGURIDAD</h3>
            <div class="form-group">
                <label>Persona Observada *</label>
                <input type="text" list="listaObservados" name="observado" id="inputObservado">
                <datalist id="listaObservados"></datalist>
            </div>
            <div class="form-group">
                <label>¿Actividad segura?</label>
                <select name="actividadSegura" id="actividadSegura" onchange="toggleEvita()">
                    <option value="SI">SÍ</option>
                    <option value="NO">NO</option>
                </select>
            </div>
            <div id="queEvita" class="form-group hidden">
                <label>¿Qué evita la seguridad?</label>
                <select name="razonInsegura" id="razonInseguraSelect" onchange="toggleOtroRazon()">
                    <option value="">-- Seleccione --</option>
                    <option value="Herramientas inadecuadas">Herramientas inadecuadas</option>
                    <option value="Falta capacitación">Falta capacitación</option>
                    <option value="Otro">Otro</option>
                </select>
                <input type="text" id="otroRazonInsegura" class="hidden mt-2">
            </div>
            <div class="form-group">
                <label>Subir foto de observación *</label>
                <input type="file" id="fotoTrabajador" accept="image/*">
            </div>
        </div>

        <div id="seccionCondicion" class="section hidden">
            <h3>II. CONDICIÓN INSEGURA</h3>
            <div class="grid-2">
                <div class="form-group">
                    <label>Equipo/Zona *</label>
                    <input type="text" id="equipoAfectado" name="equipoAfectado">
                </div>
                <div class="form-group">
                    <label>Prioridad *</label>
                    <select id="prioridadCondicion" name="prioridad">
                        <option value="Baja">Baja</option>
                        <option value="Media">Media</option>
                        <option value="Alta">Alta</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label>Descripción *</label>
                <textarea id="condicionDesc" name="descripcionCondicion" rows="3"></textarea>
            </div>
            <div class="form-group">
                <label>Evidencia Fotográfica *</label>
                <input type="file" id="fotoFile" accept="image/*">
            </div>
            <div class="form-group">
                <label>Responsables (Mínimo uno) *</label>
                <div class="checkbox-grid">
                    <label class="checkbox-item"><input type="checkbox" class="resp-check" value="Biol. Leonel De Jesus Perera Ak"> Biol. Leonel De Jesus Perera Ak</label>
                    <label class="checkbox-item"><input type="checkbox" class="resp-check" value="Lic. Rafael Jesus Perez Avila"> Lic. Rafael Jesus Perez Avila</label>
                    <label class="checkbox-item"><input type="checkbox" class="resp-check" value="Ing. Alberto Pastor Zamudio Rodriguez"> Ing. Alberto Pastor Zamudio Rodriguez</label>
                    <label class="checkbox-item"><input type="checkbox" class="resp-check" value="Ing. Julio Cesar Lopez Poot"> Ing. Julio Cesar Lopez Poot</label>
                    <label class="checkbox-item"><input type="checkbox" class="resp-check" value="Comisión de Seguridad e Higiene"> Comisión de Seguridad e Higiene</label>
                </div>
            </div>
        </div>

        <button type="submit" id="btnEnviar">Guardar Reporte</button>
    </form>
</div>

<script>
    const scriptURL = "https://script.google.com/macros/s/AKfycbyFLiX7xzDLkb7vaoMigSJouXpBFhGB-7UNRYT60N-GqODJf6-hQFIlHW305UgWFv3L/exec";
    
    // PEGAR AQUÍ TUS BASE64
    const LOGO_BASE64 = ""; 
    const FIRMA_COORDINADOR_BASE64 = "";

    const emailsResponsables = {
        "Biol. Leonel De Jesus Perera Ak": "campo.cosecha@isysa.com.mx",
        "Lic. Rafael Jesus Perez Avila": "cjeferi@isysa.com.mx",
        "Ing. Alberto Pastor Zamudio Rodriguez": "mindustrial@isysa.com.mx",
        "Ing. Julio Cesar Lopez Poot": "lavadoras@isysa.com.mx"
    };

    window.onload = () => {
        const hoy = new Date();
        document.getElementById('fechaActual').value = hoy.toISOString().split('T')[0];
        if(LOGO_BASE64) document.getElementById('logoForm').src = LOGO_BASE64;
        actualizarNumeroSemana();
        cargarListas();
    };

    function actualizarNumeroSemana() {
        const f = document.getElementById('fechaActual').value;
        if(!f) return;
        const d = new Date(f + "T00:00:00");
        d.setDate(d.getDate() + 4 - (d.getDay() || 7));
        const s = Math.ceil((((d - new Date(d.getFullYear(),0,1)) / 8.64e7) + 1) / 7);
        document.getElementById('numSemana').value = "Semana " + s;
    }

    async function cargarListas() {
        try {
            const r = await fetch(scriptURL);
            const d = await r.json();
            if(d.observadores) d.observadores.forEach(n => { let o = document.createElement('option'); o.value = n; document.getElementById('listaObservadores').appendChild(o); });
            if(d.observados) d.observados.forEach(n => { let o = document.createElement('option'); o.value = n; document.getElementById('listaObservados').appendChild(o); });
        } catch(e) {}
    }

    function toggleSections() {
        const t = document.getElementById('tipoObservacion').value;
        if(t === 'altoRiesgo') { window.location.href = "https://observacionesseg.github.io/Trabajos-de-alto-riego/"; return; }
        document.getElementById('seccionActo').classList.toggle('hidden', t !== 'acto');
        document.getElementById('seccionCondicion').classList.toggle('hidden', t !== 'condicion');
    }

    function toggleOtroLugar() { 
        const s = document.getElementById('sitioSelect');
        document.getElementById('otroSitio').classList.toggle('hidden', s.value !== 'Otro');
    }

    function toggleOtroRazon() {
        document.getElementById('otroRazonInsegura').classList.toggle('hidden', document.getElementById('razonInseguraSelect').value !== 'Otro');
    }

    function toggleEvita() {
        document.getElementById('queEvita').classList.toggle('hidden', document.getElementById('actividadSegura').value === 'SI');
    }

    document.getElementById('seguridadForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const btn = document.getElementById('btnEnviar');
        const tipo = document.getElementById('tipoObservacion').value;
        const fotoInput = (tipo === 'acto') ? document.getElementById('fotoTrabajador') : document.getElementById('fotoFile');

        if(fotoInput.files.length === 0) { alert("⚠️ Sube la foto."); return; }

        btn.innerText = "ENVIANDO DATOS...";
        btn.disabled = true;

        const payload = Object.fromEntries(new FormData(this));
        payload.semana = payload.semana.replace("Semana ", "");
        if(payload.sitio === 'Otro') payload.sitio = document.getElementById('otroSitio').value;
        
        const seleccionados = Array.from(document.querySelectorAll('.resp-check:checked')).map(cb => cb.value);
        payload.responsables = seleccionados.join(", ");
        payload.emailsResponsables = seleccionados.map(n => emailsResponsables[n] || "").filter(e => e).join(",");
        payload.horaReporte = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});

        const reader = new FileReader();
        reader.onload = async (ev) => {
            payload.fotografia = ev.target.result;
            
            // PROCESO: 1. Fetch -> 2. PDF -> 3. Reload
            try {
                await fetch(scriptURL, { method: "POST", body: new URLSearchParams(payload), mode: 'no-cors' });
                if(tipo === 'condicion') {
                    btn.innerText = "GENERANDO PDF...";
                    await generarPDF(payload);
                }
                alert("✅ Guardado.");
                location.reload();
            } catch(err) {
                alert("❌ Error.");
                btn.disabled = false;
                btn.innerText = "Guardar Reporte";
            }
        };
        reader.readAsDataURL(fotoInput.files[0]);
    });

    // --- EL FORMATO DE TU PDF ORIGINAL ---
    async function generarPDF(datos) {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF('p', 'mm', 'a4');

        const pageWidth = doc.internal.pageSize.getWidth();
        const marginLeft = 15;
        const contentWidth = pageWidth - 30;

        // Encabezado Visual
        if(LOGO_BASE64) doc.addImage(LOGO_BASE64, 'PNG', marginLeft, 12, 25, 15);
        doc.setFont("helvetica", "bold");
        doc.setFontSize(14);
        doc.setTextColor(0, 35, 68);
        doc.text("INDUSTRIA SALINERA DE YUCATÁN S.A. DE C.V.", 45, 18);
        doc.setFontSize(11);
        doc.setTextColor(100);
        doc.text("SEGURIDAD Y SALUD OCUPACIONAL", 45, 23);
        doc.setDrawColor(0, 35, 68);
        doc.line(marginLeft, 30, pageWidth - 15, 30);

        // Tabla de datos con tu estilo de celdas grises
        doc.autoTable({
            startY: 35,
            head: [[{ content: 'REPORTE: CONDICIÓN INSEGURA', colSpan: 2, styles: { halign: 'center' } }]],
            body: [
                ['FECHA Y HORA:', `${datos.fecha} | ${datos.horaReporte}`],
                ['SEMANA:', datos.semana],
                ['UBICACIÓN:', (datos.sitio || '').toUpperCase()],
                ['EQUIPO / ZONA:', (datos.equipoAfectado || '').toUpperCase()],
                ['PRIORIDAD:', datos.prioridad],
                ['REPORTÓ:', (datos.observador || '').toUpperCase()],
                ['RESPONSABLES:', datos.responsables]
            ],
            theme: 'grid',
            headStyles: { fillColor: [0, 35, 68], fontStyle: 'bold' },
            columnStyles: { 0: { cellWidth: 50, fillColor: [240, 240, 240], fontStyle: 'bold' } },
            styles: { fontSize: 9, cellPadding: 3 }
        });

        let y = doc.lastAutoTable.finalY + 10;
        doc.setFontSize(10);
        doc.setTextColor(0, 35, 68);
        doc.text("DESCRIPCIÓN DEL HALLAZGO:", marginLeft, y);
        
        doc.setFont("helvetica", "normal");
        doc.setTextColor(0);
        const desc = doc.splitTextToSize(datos.descripcionCondicion || "", contentWidth);
        doc.text(desc, marginLeft, y + 7);

        y += (desc.length * 5) + 15;

        // Imagen
        if (datos.fotografia) {
            doc.setFont("helvetica", "bold");
            doc.text("EVIDENCIA:", marginLeft, y - 5);
            doc.rect(marginLeft, y, contentWidth, 80);
            doc.addImage(datos.fotografia, 'JPEG', marginLeft + 2, y + 2, contentWidth - 4, 76);
        }

        // Firma
        const fY = 260;
        if(FIRMA_COORDINADOR_BASE64) doc.addImage(FIRMA_COORDINADOR_BASE64, 'PNG', (pageWidth/2)-20, fY-15, 40, 12);
        doc.line((pageWidth/2)-40, fY, (pageWidth/2)+40, fY);
        doc.setFontSize(8);
        doc.text("COORDINADOR DE MANTENIMIENTO INDUSTRIAL", pageWidth/2, fY+5, {align:'center'});

        doc.save(`REPORTE_ISYSA_${datos.fecha}.pdf`);
    }
</script>
</body>
</html>
