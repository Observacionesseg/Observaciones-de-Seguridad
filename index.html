<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seguridad ISYSA | Reporte de Observaciones</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

    <style>
        :root {
            --night-blue: #002344; 
            --azul-claro: #004d82;
            --azul-acento: #007bff;
            --blanco: #ffffff;
            --gris-fondo: #f1f5f9;
            --borde: #cbd5e1;
            --texto: #0f172a;
        }

        body { font-family: 'Segoe UI', sans-serif; background: #e2e8f0; padding: 15px; margin: 0; display: flex; justify-content: center; }
        .container { max-width: 850px; width: 100%; background: var(--blanco); border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); overflow: hidden; margin: 20px 0; }
        
        .header { background-color: var(--night-blue); padding: 30px 40px; color: white; display: flex; justify-content: space-between; align-items: center; gap: 20px; }
        .header h1 { margin: 0; font-size: 1.6rem; text-transform: uppercase; flex: 1; }
        .header img { max-height: 80px; width: auto; }

        form { padding: 30px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .form-group { margin-bottom: 18px; }
        .section { margin: 25px 0; padding: 20px; border-radius: 12px; background-color: var(--gris-fondo); border-left: 5px solid var(--night-blue); }
        
        h3 { color: var(--night-blue); font-size: 1.1rem; margin-top: 0; border-bottom: 1px solid var(--borde); padding-bottom: 10px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.9rem; color: #334155; }
        
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid var(--borde); border-radius: 8px; font-size: 1rem; box-sizing: border-box; }
        input:focus { border-color: var(--azul-acento); outline: none; box-shadow: 0 0 0 3px rgba(0,123,255,0.1); }

        .checkbox-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 8px; padding: 12px; background: white; border-radius: 8px; border: 1px solid var(--borde); max-height: 200px; overflow-y: auto; }
        .checkbox-item { display: flex; align-items: center; font-size: 0.85rem; gap: 8px; }
        .checkbox-item input { width: auto; }

        button { width: 100%; background: var(--night-blue); color: white; padding: 16px; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 20px; }
        button:hover { background: var(--azul-claro); }
        button:disabled { background: #94a3b8; }
        
        .hidden { display: none; }
        .semana-badge { background: #e2e8f0; font-weight: bold; color: var(--night-blue); text-align: center; }

        @media (max-width: 600px) {
            .header { flex-direction: column-reverse; text-align: center; padding: 20px; }
            .grid-2 { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Observaciones de Seguridad ISYSA</h1>
        <img src="URL_DE_TU_LOGO" alt="LOGO">
    </div>

    <form id="seguridadForm">
        <input type="hidden" name="horaReporte" id="horaReporte">

        <div class="form-group">
            <label>Tipo de Observación *</label>
            <select id="tipoObservacion" name="tipoObservacion" onchange="toggleSections()" required>
                <option value="">-- Seleccione una opción --</option>
                <option value="acto">Observación de Seguridad</option>
                <option value="condicion">Condición Insegura</option>
                <option value="altoRiesgo">Trabajo de alto riesgo</option>
            </select>
        </div>

        <div class="form-group">
            <label>Correo Electrónico *</label>
            <input type="email" name="correo" placeholder="ejemplo@isysa.com.mx" required>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label>Fecha *</label>
                <input type="date" name="fecha" id="fechaActual" onchange="actualizarNumeroSemana()" required>
            </div>
            <div class="form-group">
                <label>Semana del Año</label>
                <input type="text" id="numSemana" name="semana" class="semana-badge" readonly>
            </div>
        </div>

        <div class="form-group">
            <label>Lugar de Observación *</label>
            <select name="sitio" id="sitioSelect" onchange="toggleOtroLugar()" required>
                <option value="">Seleccione lugar...</option>
                <option value="Almacén">Almacén</option>
                <option value="Campo">Campo</option>
                <option value="Lavadoras">Lavadoras</option>
                <option value="Molinos">Molinos</option>
                <option value="Mantto. Industrial">Mantto. Industrial</option>
                <option value="Otro">Otro</option>
            </select>
            <input type="text" name="otroSitio" id="otroSitio" class="hidden" style="margin-top:10px" placeholder="Especifique lugar">
        </div>

        <div class="form-group">
            <label>Observador *</label>
            <input type="text" name="observador" placeholder="Tu nombre" required>
        </div>

        <div id="seccionActo" class="section hidden">
            <h3>I. OBSERVACIÓN DE SEGURIDAD</h3>
            <div class="form-group">
                <label>Persona Observada *</label>
                <input type="text" name="observado" id="inputObservado">
            </div>
            <div class="form-group">
                <label>¿Actividad Segura?</label>
                <select name="actividadSegura" id="actividadSegura" onchange="toggleEvita()">
                    <option value="SI">SÍ</option>
                    <option value="NO">NO</option>
                </select>
            </div>
            <div id="queEvita" class="form-group hidden">
                <label>¿Qué evita la seguridad?</label>
                <textarea name="razonInsegura"></textarea>
            </div>
            <div class="form-group">
                <label>Foto de Observación *</label>
                <input type="file" id="fotoTrabajador" accept="image/*">
            </div>
        </div>

        <div id="seccionCondicion" class="section hidden">
            <h3>II. CONDICIÓN INSEGURA</h3>
            <div class="grid-2">
                <div class="form-group">
                    <label>Equipo/Zona *</label>
                    <input type="text" id="equipoAfectado" name="equipoAfectado">
                </div>
                <div class="form-group">
                    <label>Prioridad *</label>
                    <select name="prioridad">
                        <option value="Baja">Baja</option>
                        <option value="Media">Media</option>
                        <option value="Alta">Alta</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label>Descripción del hallazgo *</label>
                <textarea id="condicionDesc" name="descripcionCondicion" rows="3"></textarea>
            </div>
            <div class="form-group">
                <label>Foto de Evidencia *</label>
                <input type="file" id="fotoFile" accept="image/*">
            </div>
            <div class="form-group">
                <label>Responsables (Seleccione) *</label>
                <div class="checkbox-grid">
                    <label class="checkbox-item"><input type="checkbox" class="resp-check" value="Ing. Alberto Pastor Zamudio Rodriguez"> Ing. Alberto Pastor Zamudio Rodriguez</label>
                    <label class="checkbox-item"><input type="checkbox" class="resp-check" value="Biol. Leonel De Jesus Perera Ak"> Biol. Leonel De Jesus Perera Ak</label>
                    <label class="checkbox-item"><input type="checkbox" class="resp-check" value="Comisión de Seguridad e Higiene"> Comisión de Seguridad e Higiene</label>
                </div>
            </div>
        </div>

        <button type="submit" id="btnEnviar">Guardar Reporte</button>
    </form>
</div>
    <script>
    const scriptURL = "https://script.google.com/macros/s/AKfycbyFLiX7xzDLkb7vaoMigSJouXpBFhGB-7UNRYT60N-GqODJf6-hQFIlHW305UgWFv3L/exec";
    
    // Configuración de Correos
    const emailsResponsables = {
        "Ing. Alberto Pastor Zamudio Rodriguez": "mindustrial@isysa.com.mx",
        "Biol. Leonel De Jesus Perera Ak": "campo.cosecha@isysa.com.mx",
        "Comisión de Seguridad e Higiene": "cshisysa@gmail.com"
        // Agrega el resto aquí siguiendo el mismo formato
    };

    // Funciones de Inicialización
    window.onload = () => {
        const hoy = new Date();
        document.getElementById('fechaActual').value = hoy.toISOString().split('T')[0];
        actualizarNumeroSemana();
    };

    function actualizarNumeroSemana() {
        const f = document.getElementById('fechaActual').value;
        if (!f) return;
        const d = new Date(f + "T00:00:00");
        const t = new Date(d.valueOf());
        const dayNr = (d.getDay() + 6) % 7;
        t.setDate(t.getDate() + 4 - dayNr);
        const jan4 = new Date(t.getFullYear(), 0, 4);
        const numSemana = 1 + Math.ceil((t - jan4) / 86400000 / 7);
        document.getElementById('numSemana').value = "Semana " + numSemana;
    }

    function toggleSections() {
        const tipo = document.getElementById('tipoObservacion').value;
        if (tipo === 'altoRiesgo') {
            window.location.href = "https://observacionesseg.github.io/Trabajos-de-alto-riego/";
            return;
        }
        document.getElementById('seccionActo').classList.toggle('hidden', tipo !== 'acto');
        document.getElementById('seccionCondicion').classList.toggle('hidden', tipo !== 'condicion');
    }

    // Toggles adicionales (Otros, Evita, etc)
    function toggleOtroLugar() { 
        const s = document.getElementById('sitioSelect'); 
        const i = document.getElementById('otroSitio');
        i.classList.toggle('hidden', s.value !== 'Otro');
        i.required = (s.value === 'Otro');
    }
    function toggleEvita() { document.getElementById('queEvita').classList.toggle('hidden', document.getElementById('actividadSegura').value === 'SI'); }

    // COMPRESIÓN DE IMAGEN
    async function comprimirImagen(file) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (e) => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const maxW = 800;
                    const scale = maxW / img.width;
                    canvas.width = maxW;
                    canvas.height = img.height * scale;
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    resolve(canvas.toDataURL('image/jpeg', 0.7));
                };
            };
        });
    }

    // ENVÍO DE FORMULARIO
    document.getElementById('seguridadForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const btn = document.getElementById('btnEnviar');
        const tipo = document.getElementById('tipoObservacion').value;
        const fotoInput = (tipo === 'acto') ? document.getElementById('fotoTrabajador') : document.getElementById('fotoFile');

        if (!fotoInput.files[0]) return alert("Debe subir una fotografía obligatoria.");

        btn.disabled = true;
        btn.innerText = "PROCESANDO... ESPERE";

        try {
            const base64Foto = await comprimirImagen(fotoInput.files[0]);
            const formData = new FormData(this);
            const payload = Object.fromEntries(formData);
            
            payload.fotografia = base64Foto;
            payload.horaReporte = new Date().toLocaleTimeString();

            // Lógica de responsables
            const seleccionados = Array.from(document.querySelectorAll('.resp-check:checked')).map(cb => cb.value);
            payload.responsables = seleccionados.join(", ");
            payload.emailsResponsables = seleccionados.map(n => emailsResponsables[n] || "").filter(em => em).join(",");

            // 1. Enviar a Google Sheets
            await fetch(scriptURL, { method: 'POST', body: new URLSearchParams(payload), mode: 'no-cors' });

            // 2. Generar PDF (Solo Condición)
            if (tipo === 'condicion') {
                await generarPDF(payload);
            }

            alert("✅ Reporte guardado con éxito.");
            location.reload();
        } catch (err) {
            console.error(err);
            alert("❌ Error al procesar.");
            btn.disabled = false;
        }
    });

    async function generarPDF(d) {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        doc.setFontSize(16);
        doc.text("REPORTE DE CONDICIÓN INSEGURA", 105, 20, { align: "center" });
        
        doc.autoTable({
            startY: 30,
            body: [
                ["Fecha/Hora", `${d.fecha} ${d.horaReporte}`],
                ["Ubicación", d.sitio],
                ["Responsables", d.responsables],
                ["Descripción", d.descripcionCondicion]
            ],
            theme: 'grid'
        });

        if (d.fotografia) {
            doc.addImage(d.fotografia, 'JPEG', 15, doc.lastAutoTable.finalY + 10, 80, 60);
        }
        doc.save(`Reporte_${d.fecha}.pdf`);
    }
</script>
</body>
</html>
