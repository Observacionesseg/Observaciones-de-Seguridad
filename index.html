<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seguridad ISYSA | Reporte de Observaciones</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

    <style>
        :root {
            --night-blue: #002344; 
            --azul-claro: #004d82;
            --azul-acento: #007bff;
            --blanco: #ffffff;
            --gris-fondo: #f1f5f9;
            --borde: #cbd5e1;
            --texto: #0f172a;
        }

        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background: #e2e8f0;
            padding: 15px; 
            color: var(--texto);
            margin: 0;
            display: flex;
            justify-content: center;
        }

        .container { 
            max-width: 850px; 
            width: 100%;
            background: var(--blanco); 
            border-radius: 16px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            overflow: hidden;
            margin: 20px 0;
        }

        .header {
            background-color: var(--night-blue);
            padding: 30px 40px;
            color: white;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .header h1 { 
            margin: 0; 
            font-size: 1.6rem; 
            letter-spacing: 1px;
            text-transform: uppercase;
            text-align: left;
            flex: 1;
        }

        .header img {
            max-height: 110px;
            width: auto;
            filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.2));
        }

        form { padding: 30px; }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 600px) {
            .header { flex-direction: column-reverse; text-align: center; padding: 20px; }
            .header h1 { text-align: center; font-size: 1.2rem; }
            .grid-2 { grid-template-columns: 1fr; }
            form { padding: 20px; }
        }

        .form-group { margin-bottom: 18px; }

        .section { 
            margin: 25px 0;
            padding: 20px; 
            border-radius: 12px; 
            background-color: var(--gris-fondo);
            border-left: 5px solid var(--night-blue);
        }

        h3 { 
            color: var(--night-blue);
            font-size: 1.1rem;
            margin-top: 0;
            border-bottom: 1px solid var(--borde);
            padding-bottom: 10px;
        }

        label { 
            display: block; 
            margin-bottom: 6px; 
            font-weight: 600; 
            font-size: 0.9rem;
            color: #334155;
        }

        input, select, textarea { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid var(--borde); 
            border-radius: 8px; 
            font-size: 1rem;
            background: white;
            box-sizing: border-box;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--azul-acento);
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.1);
        }

        .semana-badge {
            background: #e2e8f0;
            font-weight: bold;
            color: var(--night-blue);
            text-align: center;
        }

        .checkbox-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 8px; 
            padding: 12px;
            background: white;
            border-radius: 8px;
            border: 1px solid var(--borde);
            max-height: 200px;
            overflow-y: auto;
        }

        .checkbox-item { 
            display: flex; 
            align-items: center;
            font-size: 0.85rem;
            gap: 8px;
        }

        .checkbox-item input { width: auto; }

        button { 
            width: 100%; 
            background: var(--night-blue);
            color: white; 
            padding: 16px; 
            border: none; 
            border-radius: 8px; 
            font-size: 1rem; 
            font-weight: bold;
            cursor: pointer; 
            transition: background 0.3s;
            margin-top: 20px;
        }

        button:hover { background: var(--azul-claro); }
        button:disabled { background: #94a3b8; cursor: not-allowed; }
        
        .hidden { display: none; }
        .mt-2 { margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Observaciones de Seguridad ISYSA</h1>
        <img id="logoForm" src="" alt="ISYSA"> 
    </div>

    <form id="seguridadForm">
        <input type="hidden" name="horaReporte" id="horaReporte">

        <div class="form-group">
            <label>Tipo de Observación *</label>
            <select id="tipoObservacion" name="tipoObservacion" onchange="toggleSections()" required>
                <option value="">-- Seleccione una opción --</option>
                <option value="acto">Observación de Seguridad</option>
                <option value="condicion">Condición Insegura</option>
                <option value="altoRiesgo">Trabajo de alto riesgo</option>
            </select>
        </div>

        <div class="form-group">
            <label>Correo Electrónico *</label>
            <input type="email" name="correo" placeholder="ejemplo@isysa.com" required>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label>Fecha *</label>
                <input type="date" name="fecha" id="fechaActual" onchange="actualizarNumeroSemana()" required>
            </div>
            <div class="form-group">
                <label>Semana del Año</label>
                <input type="text" id="numSemana" name="semana" class="semana-badge" readonly>
            </div>
        </div>

        <div class="form-group">
            <label>Lugar de Observación *</label>
            <select name="sitio" id="sitioSelect" onchange="toggleOtroLugar()" required>
                <option value="">Seleccione lugar...</option>
                <option value="Almacén">Almacén</option>
                <option value="Biología">Biología</option>
                <option value="Calidad">Calidad</option>
                <option value="Campo">Campo</option>
                <option value="Embarques">Embarques</option>
                <option value="Lavadoras">Lavadoras</option>
                <option value="Molinos">Molinos</option>
                <option value="Oficinas">Oficinas</option>
                <option value="Registro (Vigilancia)">Registro (Vigilancia)</option>
                <option value="Mantto. Industrial">Mantto. Industrial</option>
                <option value="Mantto. Automotriz">Mantto. Automotriz</option>
                <option value="Transporte">Transporte</option>
                <option value="Otro">Otro</option>
            </select>
            <input type="text" name="otroSitio" id="otroSitio" class="hidden mt-2" placeholder="Especifique el lugar">
        </div>

        <div class="form-group">
            <label>Observador *</label>
            <input type="text" list="listaObservadores" name="observador" placeholder="Nombre de quien observa" required>
            <datalist id="listaObservadores"></datalist>
        </div>

        <div id="seccionActo" class="section hidden">
            <h3>I. OBSERVACIÓN DE SEGURIDAD</h3>
            <div class="form-group">
                <label>Persona Observada *</label>
                <input type="text" list="listaObservados" name="observado" id="inputObservado" placeholder="Nombre de quien es observado">
                <datalist id="listaObservados"></datalist>
            </div>
            <div class="form-group">
                <label>¿Realiza su actividad de forma segura?</label>
                <select name="actividadSegura" id="actividadSegura" onchange="toggleEvita()">
                    <option value="SI">SÍ</option>
                    <option value="NO">NO</option>
                </select>
            </div>
            <div id="queEvita" class="form-group hidden">
                <label>¿Qué evita que el trabajador realice sus actividades de forma segura?</label>
                <select name="razonInsegura" id="razonInseguraSelect" onchange="toggleOtroRazon()">
                    <option value="">-- Seleccione una razón --</option>
                    <option value="Herramientas, equipos o maquinaria inadecuados, no disponibles o en malas condiciones">Herramientas, equipos o maquinaria inadecuados, no disponibles o en malas condiciones</option>
                    <option value="Diseño inadecuado de las instalaciones.">Diseño inadecuado de las instalaciones.</option>
                    <option value="Diseño inadecuado del proceso">Diseño inadecuado del proceso</option>
                    <option value="Equipo de protección personal no disponible o nunca solicitado">Equipo de protección personal no disponible o nunca solicitado</option>
                    <option value="Nunca ha recibido capacitación al respecto">Nunca ha recibido capacitación al respecto</option>
                    <option value="Otro">Otro</option>
                </select>
                <input type="text" name="otroRazonInsegura" id="otroRazonInsegura" class="hidden mt-2" placeholder="Especifique la razón">
            </div>
            <div class="form-group">
                <label>¿Se cuenta con lo necesario para hacer la actividad de forma segura?</label>
                <select name="provisto" id="provistoSelect" onchange="toggleProvisto()">
                    <option value="SI">SÍ</option>
                    <option value="NO">NO</option>
                </select>
            </div>
            <div id="queFalta" class="form-group hidden">
                <label>Especifique faltante:</label>
                <div class="checkbox-grid">
                    <label class="checkbox-item"><input type="checkbox" name="falta" value="Capacitación"> Capacitación</label>
                    <label class="checkbox-item"><input type="checkbox" name="falta" value="Herramientas"> Herramientas</label>
                    <label class="checkbox-item"><input type="checkbox" name="falta" value="EPP"> Equipo de Protección (EPP)</label>
                    <label class="checkbox-item"><input type="checkbox" name="falta" value="Materiales"> Materiales</label>
                    <label class="checkbox-item"><input type="checkbox" name="falta" value="Equipos adecuados"> Equipos adecuados</label>
                    <label class="checkbox-item"><input type="checkbox" name="falta" value="Análisis"> Falta el análisis previo</label>
                    <label class="checkbox-item"><input type="checkbox" name="falta" value="Controles"> Falta instalar controles</label>
                    <label class="checkbox-item"><input type="checkbox" name="falta" value="Otro" id="checkOtroFaltante" onchange="toggleOtroFaltante()"> Otro</label>
                </div>
                <input type="text" name="otroFaltante" id="otroFaltante" class="hidden mt-2" placeholder="Especifique qué falta">
            </div>
            <div class="form-group">
                <label>Estado identificado:</label>
                <select name="estadoComportamiento">
                    <option value="Ninguno">Ninguno</option>
                    <option value="Fatiga">Fatiga</option>
                    <option value="Prisa">Prisa</option>
                    <option value="Frustración">Frustración</option>
                    <option value="Exceso de confianza">Exceso de confianza</option>
                </select>
            </div>
            <div class="form-group">
                <label>Subir fotografía de observación realizada *</label>
                <input type="file" id="fotoTrabajador" accept="image/*">
            </div>
        </div>

        <div id="seccionCondicion" class="section hidden">
            <h3>II. CONDICIÓN INSEGURA</h3>
            <div class="grid-2">
                <div class="form-group">
                    <label>Equipo o Zona Afectada *</label>
                    <input type="text" id="equipoAfectado" name="equipoAfectado" placeholder="Ej. Molino 1">
                </div>
                <div class="form-group">
                    <label>Prioridad de Atención *</label>
                    <select id="prioridadCondicion" name="prioridad">
                        <option value="Baja">Baja (Riesgo controlado)</option>
                        <option value="Media">Media (Atención pronta)</option>
                        <option value="Alta">Alta (Riesgo Inmediato)</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label>Descripción de la condición (hallazgo) *</label>
                <textarea id="condicionDesc" name="descripcionCondicion" rows="3"></textarea>
            </div>
            <div class="form-group">
                <label>Evidencia Fotográfica *</label>
                <input type="file" id="fotoFile" accept="image/*">
            </div>
            <div class="form-group">
                <label>Responsables de atención *</label>
                <div class="checkbox-grid" id="gridResponsables">
                    <label class="checkbox-item"><input type="checkbox" class="resp-check" value="Biol. Leonel De Jesus Perera Ak"> Biol. Leonel De Jesus Perera Ak</label>
                    <label class="checkbox-item"><input type="checkbox" class="resp-check" value="Lic. Rafael Jesus Perez Avila"> Lic. Rafael Jesus Perez Avila</label>
                    <label class="checkbox-item"><input type="checkbox" class="resp-check" value="QI. Gustavo Jauregui Mejia"> QI. Gustavo Jauregui Mejia</label>
                    <label class="checkbox-item"><input type="checkbox" class="resp-check" value="Ing. Mario Guzman Ordaz"> Ing. Mario Guzman Ordaz</label>
                    <label class="checkbox-item"><input type="checkbox" class="resp-check" value="Ing. Roberto Daniel Orozco De La Cruz"> Ing. Roberto Daniel Orozco De La Cruz</label>
                    <label class="checkbox-item"><input type="checkbox" class="resp-check" value="Ing. Alberto Pastor Zamudio Rodriguez"> Ing. Alberto Pastor Zamudio Rodriguez</label>
                    <label class="checkbox-item"><input type="checkbox" class="resp-check" value="Ing. Julio Cesar Lopez Poot"> Ing. Julio Cesar Lopez Poot</label>
                    <label class="checkbox-item"><input type="checkbox" class="resp-check" value="Ing. Imer Sebastian Maldonado Marrufo"> Ing. Imer Sebastian Maldonado Marrufo</label>
                    <label class="checkbox-item"><input type="checkbox" class="resp-check" value="Ing. Jorge Urbano Hernandez Muro"> Ing. Jorge Urbano Hernandez Muro</label>
                    <label class="checkbox-item"><input type="checkbox" class="resp-check" value="Ing. Jenniffer Basulto Espadas"> Ing. Jenniffer Basulto Espadas</label>
                    <label class="checkbox-item"><input type="checkbox" class="resp-check" value="QI. Sergio Alberto Maldonado Perez"> QI. Sergio Alberto Maldonado Perez</label>
                    <label class="checkbox-item"><input type="checkbox" class="resp-check" value="Biol. Carlos Eduardo Olivera Calderon"> Biol. Carlos Eduardo Olivera Calderon</label>
                </div>
            </div>
        </div>

        <button type="submit" id="btnEnviar">Guardar Reporte</button>
    </form>
</div>

<script>
    // --- CONFIGURACIÓN ---
    const scriptURL = "https://script.google.com/macros/s/AKfycbyFLiX7xzDLkb7vaoMigSJouXpBFhGB-7UNRYT60N-GqODJf6-hQFIlHW305UgWFv3L/exec";
    const LOGO_BASE64 = ""; 
    const FIRMA_COORDINADOR_BASE64 = ""; 

    const emailsResponsables = {
        "Biol. Leonel De Jesus Perera Ak": "campo.cosecha@isysa.com.mx",
        "Lic. Rafael Jesus Perez Avila": "cjeferi@isysa.com.mx",
        "QI. Gustavo Jauregui Mejia": "gjauregui@isysa.com.mx",
        "Ing. Mario Guzman Ordaz": "transportecol@isysa.com.mx",
        "Ing. Roberto Daniel Orozco De La Cruz": "rorozco@isysa.com.mx",
        "Ing. Alberto Pastor Zamudio Rodriguez": "mindustrial@isysa.com.mx",
        "Ing. Julio Cesar Lopez Poot": "lavadoras@isysa.com.mx",
        "Ing. Imer Sebastian Maldonado Marrufo": "jefealmcol@isysa.com.mx",
        "Ing. Jorge Urbano Hernandez Muro": "tautomotrizcol@isysa.com.mx",
        "Ing. Jenniffer Basulto Espadas": "molinoscol@isysa.com.mx",
        "QI. Sergio Alberto Maldonado Perez": "smaldonado@isysa.com.mx",
        "Biol. Carlos Eduardo Olivera Calderon": "biologia@isysa.com.mx"
    };

    window.onload = () => {
        const hoy = new Date();
        const offset = hoy.getTimezoneOffset() * 60000;
        const localISO = (new Date(hoy - offset)).toISOString().split('T')[0];
        document.getElementById('fechaActual').value = localISO;
        if(LOGO_BASE64) document.getElementById('logoForm').src = LOGO_BASE64;
        actualizarNumeroSemana();
        cargarListas();
    };

    function actualizarNumeroSemana() {
        const f = document.getElementById('fechaActual').value;
        if (!f) return;
        const d = new Date(f + "T00:00:00");
        const target = new Date(d.valueOf());
        const dayNr = (d.getDay() + 6) % 7;
        target.setDate(target.getDate() + 4 - dayNr);
        const jan4 = new Date(target.getFullYear(), 0, 4);
        const diff = (target - jan4) / 86400000;
        document.getElementById('numSemana').value = "Semana " + (1 + Math.ceil(diff / 7));
    }

    async function cargarListas() {
        try {
            const r = await fetch(scriptURL);
            const d = await r.json();
            if(d.observadores) d.observadores.forEach(n => { let o = document.createElement('option'); o.value = n; document.getElementById('listaObservadores').appendChild(o); });
            if(d.observados) d.observados.forEach(n => { let o = document.createElement('option'); o.value = n; document.getElementById('listaObservados').appendChild(o); });
        } catch (e) { console.log("Listas no cargadas"); }
    }

    async function comprimirImagen(base64, maxWidth = 800) {
        return new Promise((resolve) => {
            const img = new Image();
            img.src = base64;
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const scale = maxWidth / img.width;
                canvas.width = maxWidth;
                canvas.height = img.height * scale;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                resolve(canvas.toDataURL('image/jpeg', 0.7));
            };
        });
    }

    function getImageDimensions(url) {
        return new Promise((resolve) => {
            const img = new Image();
            img.onload = () => resolve({ w: img.naturalWidth, h: img.naturalHeight });
            img.src = url;
        });
    }

    function toggleSections() {
        const t = document.getElementById('tipoObservacion').value;
        if (t === 'altoRiesgo') { window.location.href = "https://observacionesseg.github.io/Trabajos-de-alto-riego/"; return; }
        const sa = document.getElementById('seccionActo');
        const sc = document.getElementById('seccionCondicion');
        sa.classList.toggle('hidden', t !== 'acto');
        sc.classList.toggle('hidden', t !== 'condicion');
        document.querySelectorAll('.section input, .section select, .section textarea').forEach(i => {
            const isVisible = !i.closest('.hidden');
            if(i.id === 'inputObservado' || i.id === 'fotoTrabajador' || i.id === 'equipoAfectado' || i.id === 'condicionDesc' || i.id === 'fotoFile') i.required = isVisible;
        });
    }

    function toggleOtroLugar() { 
        const s = document.getElementById('sitioSelect');
        const o = document.getElementById('otroSitio');
        o.classList.toggle('hidden', s.value !== 'Otro');
        o.required = (s.value === 'Otro');
    }
    function toggleOtroRazon() { document.getElementById('otroRazonInsegura').classList.toggle('hidden', document.getElementById('razonInseguraSelect').value !== 'Otro'); }
    function toggleOtroFaltante() { document.getElementById('otroFaltante').classList.toggle('hidden', !document.getElementById('checkOtroFaltante').checked); }
    function toggleProvisto() { document.getElementById('queFalta').classList.toggle('hidden', document.getElementById('provistoSelect').value === 'SI'); }
    function toggleEvita() { document.getElementById('queEvita').classList.toggle('hidden', document.getElementById('actividadSegura').value === 'SI'); }

    // --- LOGICA DE ENVÍO REESTRUCTURADA (DATA -> PDF) ---
    document.getElementById('seguridadForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const tipo = document.getElementById('tipoObservacion').value;
        const btn = document.getElementById('btnEnviar');
        const fotoInput = (tipo === 'acto') ? document.getElementById('fotoTrabajador') : document.getElementById('fotoFile');

        if(fotoInput.files.length === 0) { alert("⚠️ Sube la fotografía obligatoria."); return; }
        if(tipo === 'condicion' && document.querySelectorAll('.resp-check:checked').length === 0) { alert("⚠️ Selecciona un responsable."); return; }

        btn.innerText = "PROCESANDO... NO CIERRE";
        btn.disabled = true;

        const payload = Object.fromEntries(new FormData(this));
        payload.horaReporte = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        payload.semana = payload.semana.replace("Semana ", "");
        if(payload.sitio === 'Otro') payload.sitio = document.getElementById('otroSitio').value;
        if(payload.razonInsegura === 'Otro') payload.razonInsegura = payload.otroRazonInsegura;

        payload.falta = Array.from(document.querySelectorAll('input[name="falta"]:checked')).map(cb => 
            cb.value === 'Otro' ? "Otro: " + document.getElementById('otroFaltante').value : cb.value
        ).join(", ");

        const resps = Array.from(document.querySelectorAll('.resp-check:checked')).map(cb => cb.value.trim());
        payload.responsables = resps.join(", ");
        payload.emailsResponsables = resps.map(n => emailsResponsables[n] || "").filter(em => em).join(",");

        const reader = new FileReader();
        reader.onload = async (ev) => {
            btn.innerText = "OPTIMIZANDO FOTO...";
            payload.fotografia = await comprimirImagen(ev.target.result);
            
            btn.innerText = "GUARDANDO EN BASE DE DATOS...";
            try {
                // PRIMERO ENVIAR DATOS (CRÍTICO PARA IPHONE)
                await fetch(scriptURL, { method: "POST", body: new URLSearchParams(payload), mode: 'no-cors' });

                // LUEGO PDF (SOLO SI ES CONDICIÓN)
                if(tipo === 'condicion') {
                    btn.innerText = "GENERANDO PDF...";
                    await generarPDF(payload);
                }

                alert("✅ ¡Reporte guardado con éxito!");
                location.reload();
            } catch (err) {
                alert("❌ Error de conexión.");
                btn.disabled = false;
                btn.innerText = "Reintentar Guardar";
            }
        };
        reader.readAsDataURL(fotoInput.files[0]);
    });

    async function generarPDF(datos) {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF('p', 'mm', 'a4');
        const pW = doc.internal.pageSize.getWidth();
        const pH = doc.internal.pageSize.getHeight();
        const margin = 15;

        if(LOGO_BASE64) doc.addImage(LOGO_BASE64, 'PNG', margin, 12, 25, 15);
        doc.setFont("helvetica", "bold").setFontSize(14).setTextColor(0, 35, 68);
        doc.text("INDUSTRIA SALINERA DE YUCATÁN S.A. DE C.V.", 45, 18);
        doc.setFontSize(11).setTextColor(100).text("SEGURIDAD Y SALUD OCUPACIONAL", 45, 23);
        doc.setDrawColor(0, 35, 68).line(margin, 30, pW - margin, 30);

        doc.autoTable({
            startY: 35,
            head: [[{ content: 'REPORTE: CONDICIÓN INSEGURA', colSpan: 2, styles: { halign: 'center' } }]],
            body: [
                ['FECHA Y HORA:', `${datos.fecha} | ${datos.horaReporte}`],
                ['SEMANA:', datos.semana],
                ['UBICACIÓN:', datos.sitio.toUpperCase()],
                ['EQUIPO / ZONA:', datos.equipoAfectado.toUpperCase()],
                ['PRIORIDAD:', datos.prioridad.toUpperCase()],
                ['REPORTADO POR:', datos.observador.toUpperCase()],
                ['RESPONSABLES:', datos.responsables]
            ],
            theme: 'grid',
            headStyles: { fillColor: [0, 35, 68] },
            styles: { fontSize: 9 },
            columnStyles: { 0: { cellWidth: 50, fontStyle: 'bold', fillColor: [240, 240, 240] } }
        });

        let cursorY = doc.lastAutoTable.finalY + 10;
        doc.setFont("helvetica", "bold").text("DESCRIPCIÓN DEL HALLAZGO:", margin, cursorY);
        const splitText = doc.splitTextToSize(datos.descripcionCondicion, pW - 30);
        doc.setFont("helvetica", "normal").text(splitText, margin, cursorY + 7);
        cursorY += (splitText.length * 5) + 12;

        if(datos.fotografia) {
            if(cursorY + 80 > pH - 40) { doc.addPage(); cursorY = 20; }
            doc.setFont("helvetica", "bold").text("EVIDENCIA FOTOGRÁFICA:", margin, cursorY - 5);
            try {
                const dim = await getImageDimensions(datos.fotografia);
                const ratio = Math.min((pW - 30) / dim.w, 80 / dim.h);
                doc.addImage(datos.fotografia, 'JPEG', margin, cursorY, dim.w * ratio, dim.h * ratio);
                cursorY += (dim.h * ratio) + 15;
            } catch(e) { doc.addImage(datos.fotografia, 'JPEG', margin, cursorY, pW - 30, 80); cursorY += 95; }
        }

        if(cursorY + 30 > pH) { doc.addPage(); cursorY = 230; }
        const fY = Math.max(cursorY + 10, pH - 25);
        if(FIRMA_COORDINADOR_BASE64) doc.addImage(FIRMA_COORDINADOR_BASE64, 'PNG', (pW/2)-20, fY-15, 40, 12);
        doc.line((pW/2)-40, fY, (pW/2)+40, fY);
        doc.setFontSize(9).text("COORDINADOR DE MANTENIMIENTO INDUSTRIAL", pW/2, fY+5, {align:'center'});

        doc.save(`REPORTE_CONDICION_${datos.fecha}.pdf`);
    }
</script>
</body>
</html>
