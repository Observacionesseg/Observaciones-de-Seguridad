<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seguridad ISYSA | Reporte de Observaciones</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

    <style>
        :root {
            --night-blue: #002344; 
            --azul-claro: #004d82;
            --azul-acento: #007bff;
            --blanco: #ffffff;
            --gris-fondo: #f1f5f9;
            --borde: #cbd5e1;
            --texto: #0f172a;
            --error: #ef4444;
        }

        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background: #e2e8f0;
            padding: 15px; 
            color: var(--texto);
            margin: 0;
            display: flex;
            justify-content: center;
        }

        .container { 
            max-width: 850px; 
            width: 100%;
            background: var(--blanco); 
            border-radius: 16px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            overflow: hidden;
            margin: 20px 0;
        }

        .header {
            background-color: var(--night-blue);
            padding: 30px 40px;
            color: white;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .header h1 { 
            margin: 0; 
            font-size: 1.6rem; 
            letter-spacing: 1px;
            text-transform: uppercase;
            text-align: left;
            flex: 1;
        }

        .header img {
            max-height: 110px;
            width: auto;
            filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.2));
        }

        form { padding: 30px; }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 600px) {
            .header {
                flex-direction: column-reverse;
                text-align: center;
                padding: 20px;
            }
            .header h1 {
                text-align: center;
                font-size: 1.2rem;
            }
            .grid-2 { grid-template-columns: 1fr; }
            form { padding: 20px; }
        }

        .form-group { margin-bottom: 18px; }

        .section { 
            margin: 25px 0;
            padding: 20px; 
            border-radius: 12px; 
            background-color: var(--gris-fondo);
            border-left: 5px solid var(--night-blue);
        }

        h3 { 
            color: var(--night-blue);
            font-size: 1.1rem;
            margin-top: 0;
            border-bottom: 1px solid var(--borde);
            padding-bottom: 10px;
        }

        label { 
            display: block; 
            margin-bottom: 6px; 
            font-weight: 600; 
            font-size: 0.9rem;
            color: #334155;
        }

        input, select, textarea { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid var(--borde); 
            border-radius: 8px; 
            font-size: 1rem;
            transition: border-color 0.3s, box-shadow 0.3s;
            background: white;
            box-sizing: border-box;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--azul-acento);
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.1);
        }

        .semana-badge {
            background: #e2e8f0;
            font-weight: bold;
            color: var(--night-blue);
            text-align: center;
            cursor: default;
        }

        .checkbox-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 8px; 
            padding: 12px;
            background: white;
            border-radius: 8px;
            border: 1px solid var(--borde);
            max-height: 200px;
            overflow-y: auto;
        }

        .checkbox-item { 
            display: flex; 
            align-items: center;
            font-size: 0.85rem;
            gap: 8px;
        }

        .checkbox-item input { width: auto; }

        button { 
            width: 100%; 
            background: var(--night-blue);
            color: white; 
            padding: 16px; 
            border: none; 
            border-radius: 8px; 
            font-size: 1rem; 
            font-weight: bold;
            cursor: pointer; 
            transition: background 0.3s;
            margin-top: 20px;
        }

        button:hover { background: var(--azul-claro); }
        button:disabled { background: #94a3b8; cursor: not-allowed; }
        
        .hidden { display: none; }
        .mt-2 { margin-top: 10px; }

        .file-label {
            font-size: 0.8rem;
            color: var(--azul-claro);
            margin-top: 5px;
            display: block;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Observaciones de Seguridad ISYSA</h1>
        <img id="logoForm" src="" alt="ISYSA">
    </div>

    <form id="seguridadForm">
        <input type="hidden" name="horaReporte" id="horaReporte">

        <div class="form-group">
            <label>Tipo de Observación *</label>
            <select id="tipoObservacion" name="tipoObservacion" onchange="toggleSections()" required>
                <option value="">-- Seleccione una opción --</option>
                <option value="acto">Observación de Seguridad</option>
                <option value="condicion">Condición Insegura</option>
                <option value="altoRiesgo">Trabajo de alto riesgo</option>
            </select>
        </div>

        <div class="form-group">
            <label>Correo Electrónico *</label>
            <input type="email" name="correo" placeholder="ejemplo@isysa.com" required>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label>Fecha *</label>
                <input type="date" name="fecha" id="fechaActual" onchange="actualizarNumeroSemana()" required>
            </div>
            <div class="form-group">
                <label>Semana del Año</label>
                <input type="text" id="numSemana" name="semana" class="semana-badge" readonly placeholder="Calculando...">
            </div>
        </div>

        <div class="form-group">
            <label>Lugar de Observación *</label>
            <select name="sitio" id="sitioSelect" onchange="toggleOtroLugar()" required>
                <option value="">Seleccione lugar...</option>
                <option value="Almacén">Almacén</option>
                <option value="Biología">Biología</option>
                <option value="Calidad">Calidad</option>
                <option value="Campo">Campo</option>
                <option value="Embarques">Embarques</option>
                <option value="Lavadoras">Lavadoras</option>
                <option value="Molinos">Molinos</option>
                <option value="Oficinas">Oficinas</option>
                <option value="Registro (Vigilancia)">Registro (Vigilancia)</option>
                <option value="Mantto. Industrial">Mantto. Industrial</option>
                <option value="Mantto. Automotriz">Mantto. Automotriz</option>
                <option value="Transporte">Transporte</option>
                <option value="Otro">Otro</option>
            </select>
            <input type="text" name="otroSitio" id="otroSitio" class="hidden mt-2" placeholder="Especifique el lugar">
        </div>

        <div class="form-group">
            <label>Observador *</label>
            <input type="text" list="listaObservadores" name="observador" placeholder="Nombre de quien observa" required>
            <datalist id="listaObservadores"></datalist>
        </div>

        <div id="seccionActo" class="section hidden">
            <h3>I. OBSERVACIÓN DE SEGURIDAD</h3>
            <div class="form-group">
                <label>Persona Observada *</label>
                <input type="text" list="listaObservados" name="observado" id="inputObservado" placeholder="Nombre de quien es observado">
                <datalist id="listaObservados"></datalist>
            </div>
            <div class="form-group">
                <label>¿Realiza su actividad de forma segura?</label>
                <select name="actividadSegura" id="actividadSegura" onchange="toggleEvita()">
                    <option value="SI">SÍ</option>
                    <option value="NO">NO</option>
                </select>
            </div>
            <div id="queEvita" class="form-group hidden">
                <label>¿Qué evita que el trabajador realice sus actividades de forma segura?</label>
                <select name="razonInsegura" id="razonInseguraSelect" onchange="toggleOtroRazon()">
                    <option value="">-- Seleccione una razón --</option>
                    <option value="Herramientas inadecuadas">Herramientas inadecuadas o malas condiciones</option>
                    <option value="Diseño inadecuado">Diseño inadecuado de instalaciones/proceso</option>
                    <option value="EPP no disponible">EPP no disponible</option>
                    <option value="Falta capacitación">Nunca ha recibido capacitación</option>
                    <option value="Otro">Otro</option>
                </select>
                <input type="text" name="otroRazonInsegura" id="otroRazonInsegura" class="hidden mt-2" placeholder="Especifique la razón">
            </div>
            <div class="form-group">
                <label>¿Se cuenta con lo necesario?</label>
                <select name="provisto" id="provistoSelect" onchange="toggleProvisto()">
                    <option value="SI">SÍ</option>
                    <option value="NO">NO</option>
                </select>
            </div>
            <div id="queFalta" class="form-group hidden">
                <label>Especifique faltante:</label>
                <div class="checkbox-grid">
                    <label class="checkbox-item"><input type="checkbox" name="falta" value="Capacitación"> Capacitación</label>
                    <label class="checkbox-item"><input type="checkbox" name="falta" value="Herramientas"> Herramientas</label>
                    <label class="checkbox-item"><input type="checkbox" name="falta" value="EPP"> EPP</label>
                    <label class="checkbox-item"><input type="checkbox" name="falta" value="Otro" id="checkOtroFaltante" onchange="toggleOtroFaltante()"> Otro</label>
                </div>
                <input type="text" name="otroFaltante" id="otroFaltante" class="hidden mt-2" placeholder="Especifique qué falta">
            </div>
            <div class="form-group">
                <label>Estado identificado:</label>
                <select name="estadoComportamiento">
                    <option value="Fatiga">Fatiga</option>
                    <option value="Prisa">Prisa</option>
                    <option value="Frustración">Frustración</option>
                    <option value="Exceso de confianza">Exceso de confianza</option>
                    <option value="Ninguno">Ninguno</option>
                </select>
            </div>
            <div class="form-group">
                <label>Subir fotografía de observación realizada *</label>
                <input type="file" id="fotoTrabajador" accept="image/*">
            </div>
        </div>

        <div id="seccionCondicion" class="section hidden">
            <h3>II. CONDICIÓN INSEGURA</h3>
            <div class="grid-2">
                <div class="form-group">
                    <label>Equipo o Zona Afectada *</label>
                    <input type="text" id="equipoAfectado" name="equipoAfectado" placeholder="Ej. Molino 1">
                </div>
                <div class="form-group">
                    <label>Prioridad de Atención *</label>
                    <select id="prioridadCondicion" name="prioridad">
                        <option value="Baja">Baja</option>
                        <option value="Media">Media</option>
                        <option value="Alta">Alta</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label>Descripción de la condición *</label>
                <textarea id="condicionDesc" name="descripcionCondicion" rows="3"></textarea>
            </div>
            <div class="form-group">
                <label>Evidencia Fotográfica *</label>
                <input type="file" id="fotoFile" accept="image/*">
            </div>
            <div class="form-group">
                <label>Responsables (Seleccione al menos uno) *</label>
                <div class="checkbox-grid" id="gridResponsables">
                     <label class="checkbox-item"><input type="checkbox" class="resp-check" value="Biol. Leonel De Jesus Perera Ak"> Biol. Leonel De Jesus Perera Ak</label>
                    <label class="checkbox-item"><input type="checkbox" class="resp-check" value="Lic. Rafael Jesus Perez Avila"> Lic. Rafael Jesus Perez Avila</label>
                    <label class="checkbox-item"><input type="checkbox" class="resp-check" value="QI. Gustavo Jauregui Mejia"> QI. Gustavo Jauregui Mejia</label>
                    <label class="checkbox-item"><input type="checkbox" class="resp-check" value="Ing. Mario Guzman Ordaz"> Ing. Mario Guzman Ordaz</label>
                    <label class="checkbox-item"><input type="checkbox" class="resp-check" value="Ing. Roberto Daniel Orozco De La Cruz"> Ing. Roberto Daniel Orozco De La Cruz</label>
                    <label class="checkbox-item"><input type="checkbox" class="resp-check" value="Ing. Alberto Pastor Zamudio Rodriguez"> Ing. Alberto Pastor Zamudio Rodriguez</label>
                    <label class="checkbox-item"><input type="checkbox" class="resp-check" value="Ing. Julio Cesar Lopez Poot"> Ing. Julio Cesar Lopez Poot</label>
                    <label class="checkbox-item"><input type="checkbox" class="resp-check" value="Ing. Imer Sebastian Maldonado Marrufo"> Ing. Imer Sebastian Maldonado Marrufo</label>
                    <label class="checkbox-item"><input type="checkbox" class="resp-check" value="Ing. Jorge Urbano Hernandez Muro"> Ing. Jorge Urbano Hernandez Muro</label>
                    <label class="checkbox-item"><input type="checkbox" class="resp-check" value="Ing. Jenniffer Basulto Espadas"> Ing. Jenniffer Basulto Espadas</label>
                    <label class="checkbox-item"><input type="checkbox" class="resp-check" value="QI. Sergio Alberto Maldonado Perez"> QI. Sergio Alberto Maldonado Perez</label>
                    <label class="checkbox-item"><input type="checkbox" class="resp-check" value="Biol. Carlos Eduardo Olivera Calderon"> Biol. Carlos Eduardo Olivera Calderon</label>
                    <label class="checkbox-item"><input type="checkbox" class="resp-check" value="Comisión de Seguridad e Higiene"> Comisión de Seguridad e Higiene</label>

                </div>
            </div>
        </div>

        <button type="submit" id="btnEnviar">Guardar Reporte</button>
    </form>
</div>
<script>
    // --- CONFIGURACIÓN ---
    const scriptURL = "https://script.google.com/macros/s/AKfycbyFLiX7xzDLkb7vaoMigSJouXpBFhGB-7UNRYT60N-GqODJf6-hQFIlHW305UgWFv3L/exec";
    
    // RECUERDA PEGAR TUS BASE64 AQUÍ
    const LOGO_BASE64 = ""; 
    const FIRMA_COORDINADOR_BASE64 = "";

    const emailsResponsables = {
        "Biol. Leonel De Jesus Perera Ak": "campo.cosecha@isysa.com.mx",
        "Lic. Rafael Jesus Perez Avila": "cjeferi@isysa.com.mx",
        "QI. Gustavo Jauregui Mejia": "gjauregui@isysa.com.mx",
        "Ing. Mario Guzman Ordaz": "transportecol@isysa.com.mx",
        "Ing. Roberto Daniel Orozco De La Cruz": "rorozco@isysa.com.mx",
        "Ing. Alberto Pastor Zamudio Rodriguez": "mindustrial@isysa.com.mx",
        "Ing. Julio Cesar Lopez Poot": "lavadoras@isysa.com.mx",
        "Ing. Imer Sebastian Maldonado Marrufo": "jefealmcol@isysa.com.mx",
        "Ing. Jorge Urbano Hernandez Muro": "tautomotrizcol@isysa.com.mx",
        "Ing. Jenniffer Basulto Espadas": "molinoscol@isysa.com.mx",
        "QI. Sergio Alberto Maldonado Perez": "smaldonado@isysa.com.mx",
        "Biol. Carlos Eduardo Olivera Calderon": "biologia@isysa.com.mx"
    };

    // --- FUNCIONES DE INICIO ---
    window.onload = () => {
        const hoy = new Date();
        const offset = hoy.getTimezoneOffset() * 60000;
        const localISODate = (new Date(hoy - offset)).toISOString().split('T')[0];
        document.getElementById('fechaActual').value = localISODate;
        
        const logoImg = document.getElementById('logoForm');
        if(logoImg && typeof LOGO_BASE64 !== 'undefined' && LOGO_BASE64) {
            logoImg.src = LOGO_BASE64;
        }
        
        actualizarNumeroSemana(); 
        cargarListas();
    };

    function actualizarNumeroSemana() {
        const fechaInput = document.getElementById('fechaActual').value;
        if (!fechaInput) return;
        const date = new Date(fechaInput + "T00:00:00"); 
        const target = new Date(date.valueOf());
        const dayNr = (date.getDay() + 6) % 7;
        target.setDate(target.getDate() + 4 - dayNr);
        const jan4 = new Date(target.getFullYear(), 0, 4);
        const dayDiff = (target - jan4) / 86400000;
        const numSemana = 1 + Math.ceil(dayDiff / 7);
        document.getElementById('numSemana').value = "Semana " + numSemana;
    }

    async function cargarListas() {
        try {
            const response = await fetch(scriptURL);
            const data = await response.json();
            const dlObservador = document.getElementById('listaObservadores');
            const dlObservado = document.getElementById('listaObservados');
            if(data.observadores) data.observadores.forEach(n => { 
                let o = document.createElement('option'); o.value = n; dlObservador.appendChild(o); 
            });
            if(data.observados) data.observados.forEach(n => { 
                let o = document.createElement('option'); o.value = n; dlObservado.appendChild(o); 
            });
        } catch (e) { console.log("Listas no cargadas"); }
    }

    // --- FUNCIONES DE UI ---
    function toggleSections() {
        const tipo = document.getElementById('tipoObservacion').value;
        if (tipo === 'altoRiesgo') {
            window.location.href = "https://observacionesseg.github.io/Trabajos-de-alto-riego/"; 
            return;
        }
        document.getElementById('seccionActo').classList.toggle('hidden', tipo !== 'acto');
        document.getElementById('seccionCondicion').classList.toggle('hidden', tipo !== 'condicion');
    }

    // Funciones simples de UI (Toggles)
    function toggleOtroLugar() { 
        const s = document.getElementById('sitioSelect'); 
        const i = document.getElementById('otroSitio');
        i.classList.toggle('hidden', s.value !== 'Otro'); i.required = (s.value === 'Otro');
    }
    function toggleOtroRazon() { 
        const s = document.getElementById('razonInseguraSelect'); 
        const i = document.getElementById('otroRazonInsegura');
        i.classList.toggle('hidden', s.value !== 'Otro'); i.required = (s.value === 'Otro');
    }
    function toggleOtroFaltante() { 
        const c = document.getElementById('checkOtroFaltante'); 
        const i = document.getElementById('otroFaltante');
        i.classList.toggle('hidden', !c.checked); i.required = c.checked;
    }
    function toggleProvisto() { document.getElementById('queFalta').classList.toggle('hidden', document.getElementById('provistoSelect').value === 'SI'); }
    function toggleEvita() { document.getElementById('queEvita').classList.toggle('hidden', document.getElementById('actividadSegura').value === 'SI'); }

    // --- EL MOTOR DE VELOCIDAD: COMPRESIÓN AGRESIVA ---
    function optimizarImagen(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (event) => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    // Reducimos a 800px para máxima velocidad de subida (sigue viéndose excelente en PDF)
                    const MAX_DIM = 800; 
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_DIM) { height *= MAX_DIM / width; width = MAX_DIM; }
                    } else {
                        if (height > MAX_DIM) { width *= MAX_DIM / height; height = MAX_DIM; }
                    }
                    
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    // Calidad 0.6: El punto exacto entre peso pluma y buena visibilidad
                    ctx.drawImage(img, 0, 0, width, height);
                    const result = canvas.toDataURL('image/jpeg', 0.6);
                    
                    // Limpieza de memoria para dispositivos móviles
                    img.src = ""; 
                    resolve(result);
                };
            };
            reader.onerror = reject;
        });
    }

    // --- PROCESAMIENTO DE ENVÍO ---
    document.getElementById('seguridadForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const btn = document.getElementById('btnEnviar');
        const tipo = document.getElementById('tipoObservacion').value;
        
        let fotoInput = (tipo === 'acto') ? document.getElementById('fotoTrabajador') : document.getElementById('fotoFile');
        if (fotoInput.files.length === 0) { alert("⚠️ Sube una foto."); return; }
        if (tipo === 'condicion' && document.querySelectorAll('.resp-check:checked').length === 0) {
            alert("⚠️ Selecciona un responsable."); return;
        }

        // Cambio de estado inmediato
        btn.innerText = "⚡ OPTIMIZANDO...";
        btn.disabled = true;

        try {
            // Paso 1: Comprimir (lo que más tarda en red se soluciona aquí en ms)
            const fotoData = await optimizarImagen(fotoInput.files[0]);

            const formData = new FormData(this);
            const payload = {};
            formData.forEach((v, k) => { payload[k] = v; });

            // Formateo de Payload
            if (payload.semana) payload.semana = payload.semana.replace("Semana ", "");
            payload.sitio = (payload.sitio === 'Otro') ? payload.otroSitio : payload.sitio;
            payload.razonInsegura = (payload.razonInsegura === 'Otro') ? payload.otroRazonInsegura : payload.razonInsegura;
            
            const faltantesArr = Array.from(document.querySelectorAll('input[name="falta"]:checked')).map(cb => {
                return cb.value === 'Otro' ? "Otro: " + document.getElementById('otroFaltante').value : cb.value;
            });
            payload.falta = faltantesArr.join(", ");

            const seleccionados = Array.from(document.querySelectorAll('.resp-check:checked')).map(cb => cb.value.trim());
            payload.responsables = seleccionados.join(", ");
            payload.emailsResponsables = seleccionados.map(n => emailsResponsables[n] || "").filter(e => e !== "").join(",");
            payload.horaReporte = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            payload.fotografia = fotoData;

            // Paso 2: Envío (ahora es ultra ligero)
            btn.innerText = "🚀 ENVIANDO...";
            await enviar(payload, btn);

        } catch (err) {
            alert("❌ Error de procesamiento.");
            btn.disabled = false;
            btn.innerText = "Guardar Reporte";
        }
    });

    async function enviar(payload, btn) {
        const params = new URLSearchParams();
        for (const k in payload) params.append(k, payload[k]);

        try {
            // Guardar datos
            await fetch(scriptURL, { method: "POST", body: params, mode: 'no-cors' });

            // Generar PDF (proceso local, no consume internet)
            if (payload.tipoObservacion === 'condicion') {
                btn.innerText = "📄 CREANDO PDF...";
                await generarPDF(payload);
            }

            alert("✅ ¡Enviado!");
            location.reload();
        } catch (error) {
            alert("❌ Falló la conexión.");
            btn.disabled = false;
            btn.innerText = "Guardar Reporte";
        }
    }

    // --- PDF (OPTIMIZADO PARA PESO) ---
    async function generarPDF(datos) {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF('p', 'mm', 'a4', true); // 'true' activa compresión interna del PDF
        const marginLeft = 15;

        if(typeof LOGO_BASE64 !== 'undefined' && LOGO_BASE64) {
            doc.addImage(LOGO_BASE64, 'PNG', marginLeft, 12, 25, 15, undefined, 'FAST');
        }
        
        doc.setFontSize(14).setTextColor(0, 35, 68);
        doc.text("INDUSTRIA SALINERA DE YUCATÁN S.A. DE C.V.", 45, 18);
        doc.setFontSize(10).text("REPORTE DE CONDICIÓN INSEGURA", 45, 23);
        doc.line(marginLeft, 30, 195, 30);

        doc.autoTable({
            startY: 35,
            body: [
                ['FECHA:', datos.fecha], ['UBICACIÓN:', datos.sitio],
                ['EQUIPO:', datos.equipoAfectado], ['PRIORIDAD:', datos.prioridad],
                ['REPORTÓ:', datos.observador], ['RESPONSABLES:', datos.responsables]
            ],
            theme: 'grid', styles: { fontSize: 8, cellPadding: 2 }
        });

        let y = doc.lastAutoTable.finalY + 10;
        doc.text("DESCRIPCIÓN:", marginLeft, y);
        const desc = doc.splitTextToSize(datos.descripcionCondicion || "", 180);
        doc.setFont("helvetica", "normal").text(desc, marginLeft, y + 5);

        if (datos.fotografia) {
            // Usamos 'FAST' para que el guardado del PDF no consuma CPU
            doc.addImage(datos.fotografia, 'JPEG', marginLeft, y + 15, 80, 60, undefined, 'FAST');
        }

        if(typeof FIRMA_COORDINADOR_BASE64 !== 'undefined' && FIRMA_COORDINADOR_BASE64) {
            doc.addImage(FIRMA_COORDINADOR_BASE64, 'PNG', 85, 250, 40, 12, undefined, 'FAST');
        }
        doc.line(65, 262, 145, 262);
        doc.text("FIRMA DE RECIBIDO", 105, 267, {align: 'center'});

        doc.save(`REPORTE_${datos.fecha}.pdf`);
    }
</script>
</body>
</html>
